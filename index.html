<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERBA AI - Pemindai Tanaman Obat Offline</title>
    <!-- Memuat TensorFlow.js secara offline-ready setelah load pertama -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f1f8f5;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.15);
        }
        h1 { color: #27ae60; margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #7f8c8d; margin-top: 0; font-size: 14px; margin-bottom: 20px; }
        #webcam {
            width: 100%;
            border-radius: 15px;
            background-color: #2c3e50;
            transform: scaleX(-1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        #status {
            font-weight: 600;
            color: #d35400;
            margin: 15px 0;
            padding: 10px;
            background: #fef5ec;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2);
        }
        button:hover:not(:disabled) { background-color: #219653; transform: translateY(-1px); }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; box-shadow: none; }
        #result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e8f8f5;
            border-radius: 12px;
            border-left: 5px solid #27ae60;
            display: none;
            text-align: left;
        }
        #result-box h3 { margin: 0 0 5px 0; color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 HERBA AI</h1>
    <div class="subtitle">Sistem Pemindai Tanaman Herbal Pintar</div>
    
    <div id="status">Memuat Kecerdasan Buatan... Pastikan internet aktif sebentar di awal.</div>
    
    <video id="webcam" autoplay playsinline muted></video>
    
    <div style="margin-top: 15px;">
        <button id="scan-btn" onclick="pindaiTanaman()" disabled>Pindai Tanaman Sekarang</button>
    </div>
    
    <div id="result-box">
        <h3>Hasil Analisis AI:</h3>
        <p id="prediction" style="margin: 0; font-size: 15px; line-height: 1.5;"></p>
    </div>
</div>

<script>
    const video = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    const scanBtn = document.getElementById('scan-btn');
    const resultBox = document.getElementById('result-box');
    const predictionText = document.getElementById('prediction');
    let model;

    // 1. Mengaktifkan Akses Kamera
    async function siapkanKamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            video.srcObject = stream;
        } catch (err) {
            statusText.innerText = "❌ Gagal akses kamera. Harap izinkan akses kamera di browser Anda.";
            statusText.style.color = "#c0392b";
            statusText.style.background = "#fcedec";
        }
    }

    // 2. Memuat Model AI ke Browser Pengguna
    async function muatModelAI() {
        try {
            model = await mobilenet.load({ version: 2, alpha: 1.0 });
            statusText.innerText = "✅ AI Siap! Anda bisa matikan internet sekarang untuk menguji fitur offline.";
            statusText.style.color = "#27ae60";
            statusText.style.background = "#e8f8f5";
            scanBtn.disabled = false;
        } catch (err) {
            statusText.innerText = "❌ Gagal mengunduh model AI. Coba segarkan halaman.";
            statusText.style.color = "#c0392b";
        }
    }

    // 3. Proses Analisis Gambar secara Offline
    async function pindaiTanaman() {
        if (!model) return;
        
        statusText.innerText = "🔄 Sedang menganalisis struktur daun...";
        resultBox.style.display = "block";
        predictionText.innerHTML = "Memproses kecocokan visual...";

        // AI membaca langsung frame dari video secara lokal di perangkat
        const predictions = await model.classify(video);
        
        if (predictions && predictions.length > 0) {
            statusText.innerText = "✅ Pemindaian Selesai!";
            const hasilTeratas = predictions[0];
            
            // Menerjemahkan istilah botani umum ke bahasa yang mudah dipahami
            let namaTanaman = hasilTeratas.className.split(',')[0];
            let akurasi = (hasilTeratas.probability * 100).toFixed(1);
            
            predictionText.innerHTML = `
                Kemungkinan Terbesar: <strong style="color: #27ae60; font-size: 16px;">${namaTanaman}</strong><br>
                Tingkat Keyakinan AI: <strong>${akurasi}%</strong><br><br>
                <small style="color: #7f8c8d;">*Catatan: Pastikan daun terlihat jelas dan fokus agar hasil maksimal.</small>
            `;
        } else {
            predictionText.innerText = "Tanaman tidak terdeteksi jelas. Cek pencahayaan atau posisikan daun lebih dekat.";
        }
    }

    // Inisialisasi sistem otomatis saat halaman web dimuat
    siapkanKamera().then(muatModelAI);
</script>

</body>
</html>
